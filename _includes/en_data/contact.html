<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    <script>
    $(function(){
    $(".ajaxForm").submit(function(e){
        e.preventDefault();
        var href = $(this).attr("action");
        $.ajax({
            type: "POST",
            dataType: "json",
            url: href,
            data: $(this).serialize(),
            success: function(response){
                if(response.status == "success"){
                    alert('Thanks! Your message was sent :).');
                    window.location.href = 'https://lucija-marko.github.io/hr/#contact';
                }else{
                    alert("There's been an error: " + response.message);
                }
            }
        });
    });
    });
</script>
<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Contact and RSVP</h2>
                <h3 class="section-subheading text-muted">Please let us know by May 31, 2025, if you will be able to attend the wedding. 
                    Send us an email at <a href="mailto:lucija.krusic1@gmail.com">lucija.krusic1@gmail.com</a> or at <a href="mailto:marko.brozic01@gmail.com">marko.brozic01@gmail.com</a> or simply give us a call :).</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <!-- Create your own form using FormCarry: https://formcarry.com/ -->
                <form class="ajaxForm" action="https://formcarry.com/s/SiOlnwaeaX0" method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <input type="text" class="form-control" placeholder="Your name" id="name" name="name" required data-validation-required-message="Enter your name.">
                                <p class="help-block text-danger"></p>
                            </div>
                            <div class="control-group form-group">
                                <input type="email" class="form-control" placeholder="Your email" id="email" name="email" required data-validation-required-message="Enter your email.">
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <textarea class="form-control" placeholder="Your message" id="message" name="message" required data-validation-required-message="What's your message?"></textarea>
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center">
                            <div id="success"></div>
                            <button type="submit" class="btn btn-xl">Send message</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
