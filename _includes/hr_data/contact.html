<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    <script>
    $(function(){
    $(".ajaxForm").submit(function(e){
        e.preventDefault();
        var href = $(this).attr("action");
        $.ajax({
            type: "POST",
            dataType: "json",
            url: href,
            data: $(this).serialize(),
            success: function(response){
                if(response.status == "success"){
                    alert('Hvala! Vaša poruka je poslana :).');
                    window.location.href = 'https://lucija-marko.github.io/hr/#contact';
                }else{
                    alert("Dogodila se greška: " + response.message);
                }
            }
        });
    });
    });
</script>
<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Molimo Vas da na  do 31.4. javite hoćete li doći na vjenčanjeČ</h2>
                <h3 class="section-subheading text-muted">Pošaljite nam mail na <a href="mailto:lucija.krusic1@gmail.com">lucija.krusic1@gmail.com</a> ili na <a href="mailto:marko.brozic01@gmail.com">marko.brozic01@gmail.com</a>.</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <!-- Create your own form using FormCarry: https://formcarry.com/ -->
                <form class="ajaxForm" action="YOUR_FORM_CARRY_ENDPOINT" method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <input type="text" class="form-control" placeholder="Vaše ime" id="name" name="name" required data-validation-required-message="Unesite ime i prezime.">
                                <p class="help-block text-danger"></p>
                            </div>
                            <div class="control-group form-group">
                                <input type="email" class="form-control" placeholder="Vaš mail" id="email" name="email" required data-validation-required-message="Unesite vaš mail.">
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="control-group form-group">
                                <textarea class="form-control" placeholder="Vaša poruka" id="message" name="message" required data-validation-required-message="Koja je vaša poruka?"></textarea>
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center">
                            <div id="success"></div>
                            <button type="submit" class="btn btn-xl">Pošalji poruku</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
